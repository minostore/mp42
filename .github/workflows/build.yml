name: Build Fahmani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Configure Flutter
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Create Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Patch pdfx for this Flutter version
        run: |
          FV=$(flutter --version --machine | python3 -c "import sys,json;print(json.load(sys.stdin)['frameworkVersion'])")
          echo "Flutter $FV"
          python3 - "$FV" <<'PY'
          import sys, glob, os
          maj, minr = [int(x) for x in sys.argv[1].split('.')[:2]]
          # pdfx 2.9.x كُتب لـ Flutter 3.27+ (onSurfaceAvailable/onSurfaceCleanup)؛ على الإصدارات الأقدم الأسماء onSurfaceCreated/onSurfaceDestroyed
          if (maj, minr) >= (3, 27):
              print('Flutter >= 3.27: no patch needed'); raise SystemExit
          for f in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/pdfx-*/android/src/main/kotlin/io/scer/pdfx/Messages.kt')):
              s = open(f, encoding='utf-8').read()
              t = s.replace('onSurfaceAvailable', 'onSurfaceCreated').replace('onSurfaceCleanup', 'onSurfaceDestroyed')
              if t != s:
                  open(f, 'w', encoding='utf-8').write(t); print('patched', f)
              else:
                  print('already patched', f)
          PY

      - name: Record resolved Firebase versions
        run: |
          python3 - <<'PY'
          import re
          s = open('pubspec.lock').read()
          names = ['firebase_core','firebase_core_platform_interface','firebase_auth',
                   'firebase_auth_platform_interface','cloud_firestore','firebase_messaging']
          out = []
          for n in names:
              m = re.search(r'\n  ' + n + r':\n(?:    .*\n)*?    version: "([^"]+)"', s)
              out.append(n.replace('firebase_','fb_') + '=' + (m.group(1) if m else '?'))
          open('lib/services/build_versions.dart','w').write(
              "const String kFirebaseVersions = '" + ', '.join(out) + "';\n")
          print(', '.join(out))
          PY

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fahmani-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
