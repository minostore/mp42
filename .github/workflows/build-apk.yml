name: Build and Release Fahmani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Configure Flutter Android
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Setup release signing (fixed keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 غير موجود: سيُوقَّع الـ APK بمفتاح debug وقد يفشل تثبيت التحديثات فوق النسخة القديمة"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          echo "release signing configured"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Patch pdfx for this Flutter version
        run: |
          FV=$(flutter --version --machine | python3 -c "import sys,json;print(json.load(sys.stdin)['frameworkVersion'])")
          echo "Flutter $FV"
          python3 - "$FV" <<'PY'
          import sys, glob, os
          maj, minr = [int(x) for x in sys.argv[1].split('.')[:2]]
          # pdfx 2.9.x كُتب لـ Flutter 3.27+ (onSurfaceAvailable/onSurfaceCleanup)؛ على الإصدارات الأقدم الأسماء onSurfaceCreated/onSurfaceDestroyed
          if (maj, minr) >= (3, 27):
              print('Flutter >= 3.27: no patch needed'); raise SystemExit
          for f in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/pdfx-*/android/src/main/kotlin/io/scer/pdfx/Messages.kt')):
              s = open(f, encoding='utf-8').read()
              t = s.replace('onSurfaceAvailable', 'onSurfaceCreated').replace('onSurfaceCleanup', 'onSurfaceDestroyed')
              if t != s:
                  open(f, 'w', encoding='utf-8').write(t); print('patched', f)
              else:
                  print('already patched', f)
          PY

      - name: Patch ota_update compileSdk (fixes android:attr/lStar not found)
        run: |
          for f in ~/.pub-cache/hosted/pub.dev/ota_update-*/android/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdkVersion 35/' "$f"
            echo "patched $f"; grep -n "compileSdk" "$f"
          done

      - name: Record resolved Firebase versions
        run: |
          python3 - <<'PY'
          import re
          s = open('pubspec.lock').read()
          names = ['firebase_core','firebase_core_platform_interface','firebase_auth',
                   'firebase_auth_platform_interface','cloud_firestore','firebase_messaging']
          out = []
          for n in names:
              m = re.search(r'\n  ' + n + r':\n(?:    .*\n)*?    version: "([^"]+)"', s)
              out.append(n.replace('firebase_','fb_') + '=' + (m.group(1) if m else '?'))
          open('lib/services/build_versions.dart','w').write(
              "const String kFirebaseVersions = '" + ', '.join(out) + "';\n")
          print(', '.join(out))
          PY

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (retry on network errors)
        run: |
          # إعادة المحاولة عند أخطاء الشبكة المؤقتة أثناء تنزيل التبعيات
          for i in 1 2 3 4; do
            echo "=== Build attempt $i ==="
            if flutter build apk --release --no-shrink --split-per-abi \
                 --target-platform android-arm,android-arm64 \
                 --obfuscate --split-debug-info=build/symbols \
                 --build-number "$(( 100 + ${{ github.run_number }} ))" \
                 --build-name "1.1.${{ github.run_number }}"; then
              exit 0
            fi
            echo "Attempt $i failed; waiting before retry..."
            sleep $((i * 40))
          done
          exit 1

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahmani-release-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fahmani 1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
