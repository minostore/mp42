name: Deploy Firebase Functions

# تشغيل يدوي: GitHub -> Actions -> "Deploy Firebase Functions" -> Run workflow
# ويشتغل تلقائيًا عند تعديل مجلد functions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/deploy-functions.yml"

env:
  FIREBASE_PROJECT: studio-7708799057-99672

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check service account secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing. Add it in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools and function dependencies
        run: |
          npm install -g firebase-tools
          cd functions && npm install --omit=dev

      # 1) أهم دالة أولاً: الشراء (لا تحتاج أي أسرار)
      - name: Deploy purchaseCourse (fast path)
        run: firebase deploy --only functions:purchaseCourse --project "$FIREBASE_PROJECT" --force --non-interactive

      # 2) إعداد أسرار R2 إن أضفتها في GitHub Secrets
      - name: Set R2 secrets (optional)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        continue-on-error: true
        run: |
          for n in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            v="${!n}"
            if [ -n "$v" ]; then
              printf %s "$v" | firebase functions:secrets:set "$n" --data-file - --project "$FIREBASE_PROJECT" --force --non-interactive
            else
              echo "skip $n (not provided)"
            fi
          done

      # 3) باقي الدوال
      - name: Deploy all functions
        continue-on-error: true
        run: |
          firebase functions:delete onPaymentCompleted --region us-central1 --project "$FIREBASE_PROJECT" --force || true
          firebase deploy --only functions --project "$FIREBASE_PROJECT" --force --non-interactive
