name: fahmani
description: تطبيق مسار لمنصة الكورسات
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase versions are PINNED (no ^) to one coherent FlutterFire release.
  # Floating versions caused "channel-error" on Firebase startup because
  # firebase_core_platform_interface 5.4.1 was incompatible with the native
  # side of these firebase_core versions.
  firebase_core: 3.8.0
  firebase_auth: 5.3.3
  cloud_firestore: 5.5.0
  firebase_storage: 12.3.6
  cloud_functions: 5.1.5

  go_router: ^14.3.0
  app_links: 6.3.2
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  intl: ^0.19.0
  package_info_plus: ^8.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  jitsi_meet_flutter_sdk: ^11.6.0
  firebase_messaging: 15.1.5
  flutter_local_notifications: 17.2.3
  camera: 0.11.0+2
  pdfx: 2.9.2   # مثبّت: النسخة 2.10.0 تحتاج vector_math أحدث من المتاح في Flutter 3.24.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  # 5.4.1 is broken for firebase_core 3.x; 5.4.2 is the fixed re-release.
  firebase_core_platform_interface: 5.4.2
