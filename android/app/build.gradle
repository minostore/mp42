plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

dependencies {
    // Firebase native bootstrap is used by MainActivity on Android.
    // The BOM supplies the Firebase SDK version so firebase-app never
    // resolves as com.google.firebase:firebase-app:.
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-common"

    // Giphy SDK 2.3.17 references Kotlin Parcelize runtime classes during R8.
    // Keep the runtime explicitly available to release builds.
    implementation "org.jetbrains.kotlin:kotlin-parcelize-runtime:1.9.24"

    // flutter_local_notifications requires Java 8+ core library desugaring.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// توقيع ثابت للإصدار: بدونه كل بناء على GitHub يُوقَّع بمفتاح debug عشوائي مختلف،
// فيفشل تثبيت التحديث فوق النسخة القديمة («التطبيق لم يُثبَّت»).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.Fahmani"
    compileSdk 35

    defaultConfig {
        applicationId "com.Fahmani"
        minSdk 26
        targetSdk 35
        // يأخذ الرقم من --build-number / --build-name (أو من pubspec.yaml)
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // R8 shrinking can strip FlutterFire's platform-channel classes in
            // release builds and cause "channel-error" on Firebase startup.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
